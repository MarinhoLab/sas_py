name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same Python versions on every platform: the ones dqrobotics
        # publishes wheels for (3.10-3.14 on Linux x86_64/aarch64, macOS arm64
        # and Windows).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # macOS: the oldest macOS the wheel supports.
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Init submodules
        run: |
          git submodule update --init --recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # ── Ubuntu dependencies ─────────────────────────────────────
      # dqrobotics is built from the submodules/dqrobotics_cpp submodule as
      # part of the wheel, so only Eigen is needed. patchelf is a native
      # prerequisite of `auditwheel repair` below.
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libeigen3-dev

      # ── macOS dependencies ──────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install eigen
          echo "CMAKE_ARGS=-DCMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          # The python.org Pythons of setup-python are universal2 builds, so
          # setuptools would tag the wheel universal2; the extension is built
          # for arm64 only. ARCHFLAGS makes setup.py pass the architecture to
          # CMake, and _PYTHON_HOST_PLATFORM tags the wheel.
          echo "ARCHFLAGS=-arch arm64" >> "$GITHUB_ENV"
          echo "_PYTHON_HOST_PLATFORM=macosx-${MACOSX_DEPLOYMENT_TARGET}-arm64" >> "$GITHUB_ENV"

      # ── Windows dependencies ────────────────────────────────────
      # Eigen from vcpkg; CMakeLists.txt uses the vcpkg toolchain at C:/vcpkg.
      - name: Install vcpkg at C:/vcpkg
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/./bootstrap-vcpkg.bat
          C:/vcpkg/./vcpkg install eigen3:x64-windows

      # ── Build ──────────────────────────────────────────────────
      # setup.py forwards CMAKE_ARGS to the CMake configure step.
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      # PyPI rejects wheels tagged `linux_x86_64`/`linux_aarch64` (it requires
      # a PEP 600 `manylinux` tag). auditwheel checks the wheel's external
      # dependencies (only system libraries: dqrobotics is linked statically)
      # and retags it. macOS and Windows wheels need no repair.
      # - `--plat auto` picks the tightest compatible manylinux tag from the
      #   wheel's actual symbols (the ubuntu-latest glibc varies, so do not
      #   hardcode a `manylinux_2_X` tag).
      # - repair leaves the original wheel in dist/, so the `linux_*` wheel
      #   is removed before upload (it would 400 on PyPI).
      - name: Repair wheel (Linux, manylinux tag)
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel
          arch=$([[ "${{ matrix.os }}" == "ubuntu-latest" ]] && echo x86_64 || echo aarch64)
          auditwheel repair --plat auto -w dist/ dist/*linux_${arch}.whl
          rm -f dist/*linux_${arch}.whl

      # Install the wheel in a clean environment and use it. --no-deps: only
      # papers.icra2019 needs marinholab-solvers-qpoases, whose wheels do not
      # cover every platform and Python version; dqrobotics comes from its
      # pre-releases, the ones with wheels for Python >= 3.10.
      - name: Smoke test
        shell: bash
        run: |
          python -m venv smoke
          if [ "$RUNNER_OS" = "Windows" ]; then PY=smoke/Scripts/python; else PY=smoke/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install --pre dqrobotics numpy termcolor
          $PY -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          $GITHUB_WORKSPACE/$PY -c "
          import numpy as np
          from dqrobotics import DQ
          from marinholab.sas.core import Clock, SerialManipulatorSimulatorFriendly as SM
          arm = SM(offset_before=[DQ([1])] * 3, offset_after=[DQ([1])] * 3,
                   actuation_types=[SM.ActuationType.RX, SM.ActuationType.RY, SM.ActuationType.RZ])
          q = np.array([0.1, -0.2, 0.3])
          assert np.shape(arm.raw_pose_jacobian(q, 2)) == (8, 3)
          # Inherited DQ_SerialManipulator methods run in the dqrobotics
          # package's own copy of the library, on an object built by _core.
          assert arm.fkm(q) == arm.raw_fkm(q, 2)
          assert np.allclose(arm.pose_jacobian(q), arm.raw_pose_jacobian(q, 2))
          print(arm.fkm(q))
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
